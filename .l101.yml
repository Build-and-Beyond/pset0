course: logic101
pset: pset0
files:
  include:
    - "*.py"
  exclude:
    - "__pycache__"
    - "*.pyc"
    - ".git"
    - ".devcontainer"
  require:
    - namaste.py
    - namasteplus.py
    - translator.py
    - morse.py
visible_tests:
  - name: "namaste.py runs without errors"
    command: "python3 namaste.py"
    input: "Aarav\n"
    expected:
      contains: "Namaste"
  - name: "namaste.py outputs a greeting"
    command: "python3 namaste.py"
    input: "Tanishka\n"
    expected:
      contains: "Tanishka"
  - name: "namasteplus.py runs without errors"
    command: "python3 namasteplus.py"
    input: "Ravi\nTamil\n"
    expected:
      not_contains: "Traceback"
  - name: "translator.py runs without errors"
    command: "python3 translator.py"
    input: "fr that was mid\n"
    expected:
      not_contains: "Traceback"
  - name: "morse.py runs without errors"
    command: "python3 morse.py"
    input: "SOS\n"
    expected:
      not_contains: "Traceback"
  - name: "morse.py produces Morse output"
    command: "python3 morse.py"
    input: "SOS\n"
    expected:
      regex: "[.-]{2,}"