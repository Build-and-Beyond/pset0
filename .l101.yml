course: logic101
pset: pset0
files:
  include:
    - "*.py"
  exclude:
    - "__pycache__"
    - "*.pyc"
    - ".git"
    - ".devcontainer"
  require:
    - namaste.py
    - namasteplus.py
    - parity.py
visible_tests:
  - name: "namaste.py runs without errors"
    command: "python3 namaste.py"
    input: "Aarav\n"
    expected:
      contains: "Namaste"
  - name: "namaste.py outputs a greeting"
    command: "python3 namaste.py"
    input: "Tanishka\n"
    expected:
      contains: "Tanishka"
  - name: "namasteplus.py runs without errors"
    command: "python3 namasteplus.py"
    input: "Ravi\nHindi\n"
    expected:
      not_contains: "Traceback"
  - name: "namasteplus.py greets correctly"
    command: "python3 namasteplus.py"
    input: "Ravi\nHindi\n"
    expected:
      contains: "Namaste"
  - name: "parity.py runs without errors"
    command: "python3 parity.py"
    input: "10101\n"
    expected:
      not_contains: "Traceback"
  - name: "parity.py detects parity"
    command: "python3 parity.py"
    input: "10101\n"
    expected:
      contains: "odd"