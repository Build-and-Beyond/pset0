course: logic101
pset: pset0
files:
  include:
    - "*.py"
  exclude:
    - "__pycache__"
    - "*.pyc"
    - ".git"
    - ".devcontainer"
  require:
    - namaste.py
    - namasteplus.py
    - parity.py
    - temp.py
    - banknote.py
    - kingdom.py
visible_tests:
  - name: "namaste.py runs without errors"
    command: "python3 namaste.py"
    input: "Aarav\n"
    expected:
      contains: "Namaste"
  - name: "namaste.py outputs a greeting"
    command: "python3 namaste.py"
    input: "Tanishka\n"
    expected:
      contains: "Tanishka"
  - name: "namasteplus.py runs without errors"
    command: "python3 namasteplus.py"
    input: "Ravi\nHindi\n"
    expected:
      not_contains: "Traceback"
  - name: "namasteplus.py greets correctly"
    command: "python3 namasteplus.py"
    input: "Ravi\nHindi\n"
    expected:
      contains: "Namaste"
  - name: "parity.py runs without errors"
    command: "python3 parity.py"
    input: "10101\n"
    expected:
      not_contains: "Traceback"
  - name: "parity.py detects parity"
    command: "python3 parity.py"
    input: "10101\n"
    expected:
      contains: "odd"
  - name: "temp.py runs without errors"
    command: "python3 temp.py"
    input: "100\n"
    expected:
      not_contains: "Traceback"
  - name: "temp.py converts correctly"
    command: "python3 temp.py"
    input: "0\n"
    expected:
      contains: "32"
  - name: "banknote.py runs without errors"
    command: "python3 banknote.py"
    input: "530\n"
    expected:
      not_contains: "Traceback"
  - name: "banknote.py gives correct denominations"
    command: "python3 banknote.py"
    input: "530\n"
    expected:
      contains: "500"
  - name: "kingdom.py runs without errors"
    command: "python3 kingdom.py"
    input: "300\n"
    expected:
      not_contains: "Traceback"
  - name: "kingdom.py identifies empire"
    command: "python3 kingdom.py"
    input: "400\n"
    expected:
      contains: "Gupta"